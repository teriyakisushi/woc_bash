name: notify

# CI 结果播报：test workflow 跑完后发一张企业微信卡片。
# 用 workflow_run 而不是把通知塞进 test.yml —— 这样失败也能拿到完整结论，
# 而且模板与 workflow 都只在默认分支上解析，PR 分支改不了播报内容。
on:
  workflow_run:
    workflows: [test]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: notify-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  wecom:
    runs-on: ubuntu-latest
    env:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
    steps:
      - name: 没配 webhook 就跳过
        if: env.WECOM_WEBHOOK == ''
        run: echo "::notice title=WECOM_WEBHOOK::未配置 secret，跳过企业微信通知。"

      - uses: actions/checkout@v4
        if: env.WECOM_WEBHOOK != ''

      - name: 发企业微信卡片
        if: env.WECOM_WEBHOOK != ''
        uses: teriyakisushi/wecom-notifier@v1
        with:
          webhook: ${{ secrets.WECOM_WEBHOOK }}
          template-dir: .github/wecom-notify
          fail-on-error: "false"
